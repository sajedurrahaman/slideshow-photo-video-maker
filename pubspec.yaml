name: clip_craft_slideshow
description: Slideshow - Photo Video Maker (Flutter) for Android & iOS
publish_to: "none"
version: 1.0.9+20

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  go_router: ^16.2.4
  photo_manager: ^3.7.1
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^12.0.0
  gal: ^2.3.2
  just_audio: ^0.10.5
  file_picker: ^10.3.3
  video_player: ^2.10.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  image: ^4.5.4
  intl: ^0.20.2
  google_fonts: ^9.0.0
  lottie: ^3.8.0
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  in_app_review: ^2.0.12
  upgrader: ^13.7.0
  google_mobile_ads: ^9.2.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#2A1210"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_icon.png
  android: true
  ios: true
  android_12:
    # Use padded asset so logo ≈ 120dp (50% of ~240dp splash slot) like Flutter.
    color: "#FFFFFF"
    image: assets/images/app_icon_splash_120.png
    icon_background_color: "#FFFFFF"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/frames/
    - assets/music/
    - assets/effects/
    - assets/images/
    - assets/images/home/
    - assets/images/home/slider/
    - assets/images/editor/
    - assets/images/editor/photo_tools/
    - assets/images/editor/music_tools/
    - assets/images/editor/transitions/
    - assets/lottie/
