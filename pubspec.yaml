name: clip_craft_slideshow
description: Slideshow - Photo Video Maker (Flutter) for Android & iOS
publish_to: "none"
version: 1.0.8+20

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^16.2.4
  photo_manager: ^3.7.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^12.0.0
  gal: ^2.3.2
  just_audio: ^0.10.5
  file_picker: ^10.3.3
  video_player: ^2.10.0
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  collection: ^1.19.1
  image: ^4.5.4
  intl: ^0.20.2
  ffmpeg_kit_flutter_new: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/frames/
    - assets/music/
    - assets/effects/
    - assets/images/
    - assets/images/home/
    - assets/images/home/slider/
    - assets/images/editor/
    - assets/images/editor/transitions/
